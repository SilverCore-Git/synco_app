name: Release on main

on:
  push:
    branches: [ main ] # , recipe/main
  workflow_dispatch: # relance manuelle (onglet Actions ou `gh workflow run release_main.yml`)
    inputs:
      bump:
        description: "Niveau de version (auto : déduit des commits, fix → patch, feat → minor, ! → major)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

# Deux merges rapprochés calculeraient la même version : les releases passent une par une.
concurrency:
  group: release-main
  cancel-in-progress: false

# Pas d'artefacts (quota de stockage) : la release est créée d'abord et chaque job de build y
# upload directement son binaire. Elle reste en pré-release jusqu'au job publish-updater, qui
# la passe en « latest » une fois MSI et AppImage signés en ligne : c'est ce qui déclenche
# l'auto-update des apps desktop (tauri-plugin-updater lit releases/latest/download/latest.json).
jobs:
  create-release:
    name: Version et création de la release GitHub
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout du code (historique complet pour les tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcul de la version (dernier tag v* + commits arrivés sur main)
        id: version
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: node scripts/release-version.mjs next --bump "$BUMP"

      - name: Création de la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Synco ${{ steps.version.outputs.tag }}"
          prerelease: true
          make_latest: false
          generate_release_notes: true

  build-android-apk:
    name: Build Android APK (debug)
    needs: create-release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configuration du JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configuration du SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Génération des fichiers .env
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" > .env.production
          echo "${{ secrets.ENV_PRODUCTION }}" > .env

      - name: Installation des dépendances
        run: bun install

      - name: Version de l'app
        run: node scripts/release-version.mjs apply "$VERSION" --android-code "${{ github.run_number }}"

      - name: Build des assets web
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run build

      - name: Synchronisation Capacitor Android
        run: npx cap sync android

      - name: Build de l'APK debug (non signé)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload de l'APK sur la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk synco-android-debug.apk
          gh release upload "$RELEASE_TAG" synco-android-debug.apk --clobber

  build-windows-msi:
    name: Build de l'installeur Windows (MSI)
    needs: create-release
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Génération des fichiers .env
        shell: bash
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" > .env.production
          echo "${{ secrets.ENV_PRODUCTION }}" > .env

      - name: Installation des dépendances
        shell: powershell
        run: bun install

      - name: Version de l'app
        shell: bash
        run: node scripts/release-version.mjs apply "$VERSION"

      # Via tauri-run.js comme sur Linux : c'est lui qui remplace les marqueurs __CSP_*__ de la CSP.
      - name: Build de l'installeur MSI
        shell: powershell
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run tauri:build -- --bundles msi

      - name: Signature (updater) et upload du MSI sur la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          MSI=$(ls src-tauri/target/release/bundle/msi/*.msi)
          bunx tauri signer sign "$MSI"
          gh release upload "$RELEASE_TAG" "$MSI" "$MSI.sig" --clobber

  build-linux-appimage:
    name: Build de l'AppImage Linux
    needs: create-release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
      VERSION: ${{ needs.create-release.outputs.version }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installation de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Installation des dépendances système Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev desktop-file-utils \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav \
            xdg-utils shared-mime-info

      - name: Génération des fichiers .env
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" > .env.production
          echo "${{ secrets.ENV_PRODUCTION }}" > .env

      - name: Installation des dépendances
        run: bun install

      - name: Version de l'app
        run: node scripts/release-version.mjs apply "$VERSION"

      - name: Build de l'AppImage
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run tauri:build -- --bundles appimage

      - name: Retrait de libs bundlées problématiques et re-packaging
        run: |
          cd src-tauri/target/release/bundle/appimage
          APPIMAGE=$(ls *.AppImage)
          chmod +x "$APPIMAGE"
          ./"$APPIMAGE" --appimage-extract
          rm -f squashfs-root/usr/lib/libwayland-client.so.0
          rm -f squashfs-root/usr/lib/gstreamer-1.0/libgstfluidsynthmidi.so
          
          # Correction des permissions 0700 pour éviter l'erreur appimagetool
          chmod -R a+rX squashfs-root
          chmod a+rx squashfs-root/AppRun

          curl -sL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run squashfs-root "$APPIMAGE"
          rm -rf squashfs-root appimagetool

      # Signée après le re-packaging : c'est ce fichier-là que l'updater télécharge et vérifie.
      - name: Signature (updater) et upload de l'AppImage sur la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage)
          bunx tauri signer sign "$APPIMAGE"
          gh release upload "$RELEASE_TAG" "$APPIMAGE" "$APPIMAGE.sig" --clobber

  publish-updater:
    name: Publication de la mise à jour (latest.json)
    needs: [create-release, build-windows-msi, build-linux-appimage]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
      VERSION: ${{ needs.create-release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Génération de latest.json (URLs + signatures MSI et AppImage)
        run: |
          gh release view "$RELEASE_TAG" --json assets > assets.json
          gh release download "$RELEASE_TAG" --pattern '*.sig' --dir sigs
          node scripts/updater-manifest.mjs "$VERSION" "$RELEASE_TAG" assets.json sigs > latest.json
          cat latest.json

      - name: Upload de latest.json et passage de la release en « latest »
        run: |
          gh release upload "$RELEASE_TAG" latest.json --clobber
          gh release edit "$RELEASE_TAG" --prerelease=false --latest

  build-docker-image:
    name: Build et push de l'image Docker (front, prod)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Owner du repo en minuscule (requis par GHCR)
        id: meta
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraction des VITE_* depuis le secret ENV_PRODUCTION (build args)
        id: env
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" > /tmp/env.production
          {
            echo "args<<EOF"
            grep '^VITE_' /tmp/env.production || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build et push de l'image prod
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          target: prod
          push: true
          build-args: ${{ steps.env.outputs.args }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/synco_app:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/synco_app:${{ github.sha }}