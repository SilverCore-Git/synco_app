name: Release on main

on:
  push:
    branches: [ main ]
  workflow_dispatch: # relance manuelle (onglet Actions ou `gh workflow run release_main.yml`)

permissions:
  contents: write

# Pas d'artefacts (quota de stockage) : la release est créée d'abord et chaque job de build y
# upload directement son binaire.
env:
  RELEASE_TAG: dev-${{ github.run_number }}

jobs:
  create-release:
    name: Création de la release GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Création de la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "Synco dev build #${{ github.run_number }}"
          prerelease: true
          generate_release_notes: true

  build-android-apk:
    name: Build Android APK (debug)
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configuration du JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configuration du SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools' # le paquet legacy "tools" n'existe plus dans le repo Google (cf android-actions/setup-android#537)

      - name: Génération des fichiers .env
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" > .env.production
          echo "${{ secrets.ENV_PRODUCTION }}" > .env

      - name: Installation des dépendances
        run: bun install

      - name: Build des assets web
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run build

      - name: Synchronisation Capacitor Android
        run: npx cap sync android

      - name: Build de l'APK debug (non signé)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload de l'APK sur la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk synco-android-debug.apk
          gh release upload "$RELEASE_TAG" synco-android-debug.apk

  build-windows-msi:
    name: Build de l'installeur Windows (MSI)
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installation des dépendances
        shell: powershell
        run: bun install

      - name: Build de l'installeur MSI
        shell: powershell
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: bunx tauri build --bundles msi

      - name: Upload du MSI sur la release
        shell: bash # powershell n'expand pas le glob pour gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" src-tauri/target/release/bundle/msi/*.msi

  build-linux-appimage:
    name: Build de l'AppImage Linux
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installation de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Installation des dépendances système Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev desktop-file-utils \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav \
            xdg-utils shared-mime-info

      - name: Génération des fichiers .env
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" > .env.production
          echo "${{ secrets.ENV_PRODUCTION }}" > .env

      - name: Installation des dépendances
        run: bun install

      - name: Build de l'AppImage
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run tauri:build -- --bundles appimage

      - name: Retrait de libs bundlées problématiques (EGL_BAD_PARAMETER sur Mesa 25+ cf tauri-apps/tauri#15665, segfault GStreamer/JACK)
        run: |
          cd src-tauri/target/release/bundle/appimage
          APPIMAGE=$(ls *.AppImage)
          chmod +x "$APPIMAGE"
          ./"$APPIMAGE" --appimage-extract
          rm -f squashfs-root/usr/lib/libwayland-client.so.0
          # libgstfluidsynthmidi.so (rendu MIDI, inutilisé par l'app) dépend de la couche de
          # compat JACK de pipewire ; sur certaines distros la version système de pipewire n'a
          # pas le symbole attendu (pw_log_topic_register), ce qui fait planter (SIGSEGV) le
          # scan des plugins GStreamer au lancement, avant même d'afficher une fenêtre.
          rm -f squashfs-root/usr/lib/gstreamer-1.0/libgstfluidsynthmidi.so
          curl -sL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run squashfs-root "$APPIMAGE"
          rm -rf squashfs-root appimagetool

      - name: Upload de l'AppImage sur la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" src-tauri/target/release/bundle/appimage/*.AppImage

  build-docker-image:
    name: Build et push de l'image Docker (front, prod)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Owner du repo en minuscule (requis par GHCR)
        id: meta
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraction des VITE_* depuis le secret ENV_PRODUCTION (build args)
        id: env
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" > /tmp/env.production
          {
            echo "args<<EOF"
            grep '^VITE_' /tmp/env.production || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build et push de l'image prod
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false # pas d'artefact .dockerbuild
        with:
          context: .
          target: prod
          push: true
          build-args: ${{ steps.env.outputs.args }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/synco_app:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/synco_app:${{ github.sha }}
