name: Release on main

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configuration du JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configuration du SDK Android
        uses: android-actions/setup-android@v3

      - name: Génération des fichiers .env
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" > .env.production
          echo "${{ secrets.ENV_PRODUCTION }}" > .env

      - name: Installation des dépendances
        run: bun install

      - name: Build des assets web
        run: bun run build

      - name: Synchronisation Capacitor Android
        run: npx cap sync android

      - name: Build de l'APK debug (non signé)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: synco-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-windows-msi:
    name: Build de l'installeur Windows (MSI)
    runs-on: windows-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Installation de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Génération des fichiers .env
        shell: bash
        run: |
          echo "${{ secrets.ENV_PRODUCTION }}" > .env.production
          echo "${{ secrets.ENV_PRODUCTION }}" > .env

      - name: Installation des dépendances
        run: bun install

      - name: Build de l'installeur MSI
        run: bun run tauri:build -- --bundles msi

      - name: Upload du MSI
        uses: actions/upload-artifact@v4
        with:
          name: synco-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  create-release:
    name: Création de la release GitHub
    needs: [ build-android-apk, build-windows-msi ]
    runs-on: ubuntu-latest
    steps:
      - name: Téléchargement des artefacts
        uses: actions/download-artifact@v4
        with:
          pattern: synco-*
          path: release-assets
          merge-multiple: true

      - name: Création de la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: "Synco dev build #${{ github.run_number }}"
          prerelease: true
          generate_release_notes: true
          files: release-assets/**
