<!doctype html>
<html lang="fr">

  <head>
    
    <!-- Meta de base -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Précharge la bannière du formulaire PIN (App.vue) : sans ça elle ne
         commence à charger qu'au montage de ce formulaire, bien après le
         premier rendu, et apparaît visiblement après coup. -->
    <link rel="preload" as="image" href="/banner.svg" />

    <!-- __CSP_DEV_*__ (résolus par devLanCspPlugin, vite.config.ts) ne portent
         jamais de localhost:* dans un build de production — avant ce correctif
         ces origines étaient écrites en dur ici, donc présentes même en prod,
         faisant de tout service local de l'utilisateur (serveur de dev, port
         ouvert par un autre logiciel) une source de script/connexion/frame
         autorisée pour app.synco.one (audit FX5). __DEV_LAN_ORIGIN__ reste du
         même principe, pour une IP LAN précise (VITE_TAURI_DEV_IP).

         connect-src porte aussi 'https:' (tout domaine, pas seulement ceux
         listés explicitement) : useLinkPreview.ts fetch directement depuis
         le client l'URL qu'un utilisateur colle dans un message, pour ne
         jamais faire passer ce lien par synco_api. Accepté en connaissance
         de cause : ça affaiblit la CSP pour toute l'app (une exfiltration
         par fetch/XHR en cas de XSS ailleurs n'est plus limitée aux
         domaines listés ci-dessous). -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com__CSP_DEV_SCRIPT__ __DEV_LAN_ORIGIN__; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; connect-src 'self' blob: https: tauri: tauri://localhost http://tauri.localhost http://ipc.localhost https://api.synco.one https://cdn.synco.one ws://api.synco.one wss://api.synco.one ws://api.synco.one:9001 wss://api.synco.one:9001 https://auth.silvercore.fr https://livekit.silvercore.fr wss://livekit.silvercore.fr__CSP_DEV_CONNECT__ __DEV_LAN_ORIGIN__ https://huggingface.co https://*.huggingface.co https://cdn.jsdelivr.net https://raw.githubusercontent.com https://cas-bridge.xethub.hf.co https://*.cdn.hf.co; media-src 'self' blob:; img-src 'self' data: blob: https://avatars.githubusercontent.com__CSP_DEV_IMG__ __DEV_LAN_ORIGIN__ https://api.synco.one; frame-src 'self' blob:__CSP_DEV_FRAME__ __DEV_LAN_ORIGIN__ https://api.synco.one https://auth.silvercore.fr;">
    <title>Synco.</title>
    <meta name="description" content="Synco, la plateforme de collaboration sécurisée : messagerie chiffrée, salons, appels vocaux et vidéo pour votre équipe." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Synco" />
    <meta property="og:title" content="Synco." />
    <meta property="og:description" content="La plateforme de collaboration sécurisée : messagerie chiffrée, salons, appels vocaux et vidéo pour votre équipe." />
    <meta property="og:url" content="https://app.synco.one" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image" content="https://app.synco.one/banner.png" />
    <meta property="og:image:width" content="279" />
    <meta property="og:image:height" content="90" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Synco." />
    <meta name="twitter:description" content="La plateforme de collaboration sécurisée : messagerie chiffrée, salons, appels vocaux et vidéo pour votre équipe." />
    <meta name="twitter:image" content="https://app.synco.one/banner.png" />

  </head>

  <style>

    html, body {
      background-color: #121214;
      margin: 0;
      padding: 0;
    }

    .shimmer {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.4) 50%,
        transparent 100%
      );
      
      animation: shine 4s infinite linear;
    }

    @keyframes shine {
      0% { transform: translateX(-150%) skewX(-20deg); }
      30% { transform: translateX(150%) skewX(-20deg); }

      31% { transform: translateX(-150%) skewX(-20deg); }
      100% { transform: translateX(-150%) skewX(-20deg); }
    }

    /* Barre indéterminée : ce loader statique disparaît avant que
       App.vue connaisse une vraie progression (health check, Keycloak...),
       donc pas de largeur pilotée ici — juste de quoi rester visuellement
       cohérent avec la barre déterminée du LogoLoader.vue qui prend le
       relais (même dimensions/couleur). */
    #boot-progress-track {
      width: 10rem;
      height: 0.25rem;
      border-radius: 999px;
      background-color: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      margin-top: 1.5rem;
    }

    #boot-progress-bar {
      height: 100%;
      width: 33%;
      border-radius: 999px;
      background-color: #16ac77;
      animation: boot-progress-indeterminate 1.4s ease-in-out infinite;
    }

    @keyframes boot-progress-indeterminate {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(300%); }
      100% { transform: translateX(300%); }
    }

  </style>

  <body>

    <div id="app"></div>

    <div id="boot-loader" style="
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #121214;
        user-select: none;
    ">

      <div style="
          position: relative;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          border-radius: 0.75rem;
      ">

        <img
          src="/assets/logo/synco/favicon_synco.svg"
          alt="Logo"
          style="height: 80px; z-index: 10; position: relative;"
        />
        <div class="shimmer"></div>

      </div>

      <div id="boot-progress-track">
        <div id="boot-progress-bar"></div>
      </div>

    </div>

    <script type="module" src="/src/main.ts"></script>

  </body>

</html>
