<!doctype html>
<html lang="fr">

  <head>
    
    <!-- Meta de base -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self' https://api-synco.silvercore.fr wss://api-synco.silvercore.fr ws://api-synco.silvercore.fr:9001 wss://api-synco.silvercore.fr:9001 https://auth.silvercore.fr https://livekit.silvercore.fr wss://livekit.silvercore.fr http://localhost:* https://localhost:* ws://localhost:* wss://localhost:* https://192.168.1.73:*; img-src 'self' data: https://ui-avatars.com;">
    <title>Synco.</title>

  </head>

  <style>

    html, body {
      background-color: #121214;
      margin: 0;
      padding: 0;
    }

    .shimmer {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.4) 50%,
        transparent 100%
      );
      
      animation: shine 4s infinite linear;
    }

    @keyframes shine {
      0% { transform: translateX(-150%) skewX(-20deg); }
      30% { transform: translateX(150%) skewX(-20deg); }
      
      31% { transform: translateX(-150%) skewX(-20deg); }
      100% { transform: translateX(-150%) skewX(-20deg); }
    }

  </style>

  <body>

    <div id="app">

      <div style="
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--bg);
        user-select: none;
    ">

        <div style="
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 0.75rem;
        ">
          
          <img 
            src="/favicon.ico" 
            alt="Logo" 
            style="height: 80px; z-index: 10; position: relative;" 
          />
          <div class="shimmer" />

        </div>

      </div>

    </div>

    <script type="module" src="/src/main.ts"></script>

  </body>

</html>
