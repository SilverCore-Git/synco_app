# share.synco.one : page de téléchargement des liens (npm run build:share).
#
# Origine distincte de l'app, sans cookie ni stockage : la page déchiffre un
# contenu choisi par un tiers. Seules /l/<id> (le secret est dans le
# fragment, jamais envoyé ici), / et /assets/ existent.
#
# La CSP doit rester identique à celle résolue par share/index.html en
# production (shareCspPlugin, vite.share.config.ts), avec en plus
# frame-ancestors, qu'une <meta> ne peut pas porter.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    access_log /var/log/nginx/access.log;

    gzip on;
    gzip_types text/css application/javascript;

    # Répétés dans chaque location : nginx n'hérite pas des add_header d'un
    # bloc parent dans une location qui en déclare.
    set $csp "default-src 'none'; script-src 'self'; worker-src 'self' blob:; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src https://api.synco.one https://cdn.synco.one; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'";

    # Page : jamais en cache (une nouvelle version de la page = une nouvelle CSP, de nouveaux scripts).
    location ~ ^/(l/[A-Za-z0-9_-]{22}/?)?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), clipboard-read=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Scripts, styles et worker versionnés (hash dans le nom).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Tout le reste n'existe pas (pas de repli sur index.html).
    location / {
        return 404;
    }
}
