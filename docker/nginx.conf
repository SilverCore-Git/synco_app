server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # nginx does not inherit `add_header` from this server block into a
    # location that defines its own `add_header` directives — so these are
    # repeated in every location below rather than declared once here.
    #
    # Content-Security-Policy here only carries `frame-ancestors`: browsers
    # ignore that directive when it's delivered via <meta> (as index.html's
    # full CSP is, so it stays maintained in one place), but do honor it
    # from a real HTTP header — this adds exactly what the <meta> tag can't.
    # Multiple delivered CSPs are enforced together (most restrictive wins
    # per directive), so this doesn't relax or duplicate the <meta> policy.

    # SPA : toute route inconnue retombe sur index.html (vue-router en mode history)
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "frame-ancestors 'self';" always;
    }

    # Assets versionnés (hash dans le nom) : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "frame-ancestors 'self';" always;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
