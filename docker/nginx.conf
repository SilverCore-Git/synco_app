server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Version et nom du serveur hors des en-têtes/pages d'erreur (audit FX5).
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # nginx does not inherit `add_header` from this server block into a
    # location that defines its own `add_header` directives — so these are
    # repeated in every location below rather than declared once here.
    #
    # Content-Security-Policy ici porte la politique complète, pas seulement
    # frame-ancestors : la <meta> d'index.html ne protège que index.html
    # lui-même, jamais les documents servis sans lui (firebase-messaging-sw.js,
    # silent-check-sso.html avec son script inline, tout fichier de public/) —
    # ils ne traversent que ce bloc nginx (audit FX5). Doit rester identique à
    # la CSP résolue par index.html en production (sans les placeholders
    # __CSP_DEV_*__/__DEV_LAN_ORIGIN__, jamais utilisés hors développement).
    #
    # X-Frame-Options "SAMEORIGIN" ici, aligné sur frame-ancestors 'self' :
    # "DENY" contredisait frame-ancestors (qui autorise l'auto-encadrement) —
    # lequel des deux s'applique dépendait alors du navigateur.

    # SPA : toute route inconnue retombe sur index.html (vue-router en mode history)
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; connect-src 'self' blob: https: tauri: tauri://localhost http://tauri.localhost http://ipc.localhost https://api.synco.one https://cdn.synco.one ws://api.synco.one wss://api.synco.one ws://api.synco.one:9001 wss://api.synco.one:9001 https://auth.silvercore.fr https://livekit.silvercore.fr wss://livekit.silvercore.fr https://huggingface.co https://*.huggingface.co https://cdn.jsdelivr.net https://raw.githubusercontent.com https://cas-bridge.xethub.hf.co https://*.cdn.hf.co; media-src 'self' blob:; img-src 'self' data: blob: https://avatars.githubusercontent.com https://api.synco.one; frame-src 'self' blob: https://api.synco.one https://auth.silvercore.fr; frame-ancestors 'self';" always;
    }

    # Assets versionnés (hash dans le nom) : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; connect-src 'self' blob: https: tauri: tauri://localhost http://tauri.localhost http://ipc.localhost https://api.synco.one https://cdn.synco.one ws://api.synco.one wss://api.synco.one ws://api.synco.one:9001 wss://api.synco.one:9001 https://auth.silvercore.fr https://livekit.silvercore.fr wss://livekit.silvercore.fr https://huggingface.co https://*.huggingface.co https://cdn.jsdelivr.net https://raw.githubusercontent.com https://cas-bridge.xethub.hf.co https://*.cdn.hf.co; media-src 'self' blob:; img-src 'self' data: blob: https://avatars.githubusercontent.com https://api.synco.one; frame-src 'self' blob: https://api.synco.one https://auth.silvercore.fr; frame-ancestors 'self';" always;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self';" always;
    }
}
