[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
# Déjà présent transitivement (via tauri) à 2.5.8 : juste promu en
# dépendance directe pour valider l'URL passée à open_external_url, qui ne
# faisait aucun contrôle de schéma/hôte avant de la transmettre à un
# interpréteur système (audit FX1).
url = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
# Trousseau de l'OS (Keychain macOS, Gestionnaire d'identifiants Windows,
# Secret Service/GNOME Keyring Linux) pour le refresh token Keycloak, qui
# vivait en clair dans localStorage sur Tauri (audit FC9). Mobile (Android/
# iOS) passe par un mécanisme Capacitor séparé côté JS, pas par ce crate.
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
